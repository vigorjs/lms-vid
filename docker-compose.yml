services:
  postgres:
    image: postgres:17-alpine
    profiles: ["bundled-db"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pjokvid}
    ports:
      - "${POSTGRES_PUBLIC_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    ports:
      - "${MINIO_PUBLIC_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PUBLIC_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_API_CORS_ALLOW_ORIGIN: ${APP_URL:-http://localhost:3000}
    volumes:
      - minio-data:/data

  minio-https:
    image: caddy:2-alpine
    profiles: ["vps-https"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      MINIO_HTTPS_HOST: ${MINIO_HTTPS_HOST:-minio.129-226-144-109.sslip.io}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      minio:
        condition: service_started
  minio-init:
    build:
      context: .
      dockerfile: infra/worker/Dockerfile
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-lms-videos}
      APP_URL: ${APP_URL:-http://localhost:3000}
    command: ["node", "infra/minio/init-minio.mjs"]

  migrate:
    profiles: ["bundled-db"]
    build:
      context: .
      dockerfile: infra/worker/Dockerfile
      target: build
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${WORKER_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/pjokvid}
      DIRECT_URL: ${WORKER_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/pjokvid}
    command: ["npx", "prisma", "migrate", "deploy"]

  video-worker:
    build:
      context: .
      dockerfile: infra/worker/Dockerfile
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1g
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${WORKER_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/pjokvid}
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-lms-videos}

volumes:
  postgres-data:
  minio-data:
  caddy-data:
  caddy-config:
